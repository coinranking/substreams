syntax = "proto3";

package evm.common.v1;

// All extracted blockchain data per block
message BlockOutput {
  repeated PoolTicker tickers = 1;
  repeated NewPool new_pools = 2;         // V2 PairCreated and V3 PoolCreated events
  repeated SupplyDelta supply_deltas = 3;
}

// Pool ticker data - aggregated swap activity per pool per block
message PoolTicker {
  // Pool identification
  string pool_address = 1;

  // Block-level volume aggregates (sum of all swaps in this block)
  string block_volume_token0 = 2;  // Total token0 volume in this block (raw token units as integer)
  string block_volume_token1 = 3;  // Total token1 volume in this block (raw token units as integer)
  uint32 swap_count = 4;           // Number of swaps for this pool in this block

  // Price data - raw sqrtPriceX96
  // Client must calculate: price = (sqrtPriceX96 / 2^96)^2 * 10^(decimals0 - decimals1)
  // V3: Directly from swap events
  // V2: Calculated from reserves via Sync events as sqrt(reserve1/reserve0) * 2^96
  string sqrt_price_x96 = 5;

  // Metadata
  uint64 block_number = 6;
  uint64 timestamp = 7;
}

// New pool creation event from DEX factory contracts
message NewPool {
  string pool_address = 1;
  string factory_address = 2;
  string token0_address = 3;
  string token1_address = 4;
  uint32 fee = 5;
  uint64 block_number = 6;
  uint64 timestamp = 7;
}

// ERC20 mint/burn event
message SupplyDelta {
  string token_address = 1;   // ERC20 contract that emitted Transfer
  string amount = 2;          // Raw token units (always positive)
  bool is_mint = 3;           // true = mint (from=0x0), false = burn (to=0x0)
  uint64 block_number = 4;
  uint64 timestamp = 5;
}
