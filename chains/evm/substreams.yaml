specVersion: v0.1.0

package:
  name: coinranking_evm
  version: v0.2.0
  url: https://github.com/coinranking/substreams
  image: assets/coinranking-logo.png
  description: "EVM chain substreams for DEX activity and token supply tracking"

protobuf:
  files:
    - evm_common.proto
  importPaths:
    - ../../proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../../target/wasm32-unknown-unknown/release/coinranking_evm.wasm

# Network can be specified at runtime via CLI parameters
# Examples: mainnet, polygon, arbitrum-one, optimism, base, etc.

modules:
  - name: map_block_output
    kind: map
    # No default initial block - must be specified via CLI parameter --start-block
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:evm.common.v1.BlockOutput
